<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- Engineering Agents: hub-and-spoke hex platform mark -->
  <!-- Navy #1F4E79 | Teal #2EC4B6 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- left spokes -->
    <line x1="198" y1="292" x2="318" y2="360" stroke="#1F4E79" stroke-width="18"/>
    <line x1="198" y1="512" x2="318" y2="512" stroke="#1F4E79" stroke-width="18"/>
    <line x1="198" y1="732" x2="318" y2="664" stroke="#1F4E79" stroke-width="18"/>

    <!-- hub to upper/right lower nodes -->
    <line x1="430" y1="430" x2="520" y2="350" stroke="#1F4E79" stroke-width="18"/>
    <line x1="430" y1="594" x2="520" y2="674" stroke="#1F4E79" stroke-width="18"/>

    <!-- arrows to output -->
    <path d="M548 350 L700 470" stroke="#1F4E79" stroke-width="18"/>
    <path d="M548 350 L688 458" stroke="#1F4E79" stroke-width="18" marker-end="url(#arrowNavy)"/>

    <path d="M548 674 L700 554" stroke="#1F4E79" stroke-width="18"/>
    <path d="M548 674 L688 566" stroke="#1F4E79" stroke-width="18" marker-end="url(#arrowNavy)"/>

    <path d="M430 512 L700 512" stroke="#2EC4B6" stroke-width="22"/>
    <path d="M430 512 L688 512" stroke="#2EC4B6" stroke-width="22" marker-end="url(#arrowTeal)"/>

    <!-- left input hexes -->
    <polygon points="198,292 238,269 278,292 278,338 238,361 198,338" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>
    <polygon points="198,512 238,489 278,512 278,558 238,581 198,558" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>
    <polygon points="198,732 238,709 278,732 278,778 238,801 198,778" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>

    <!-- central hub -->
    <polygon points="374,360 454,314 534,360 534,452 454,498 374,452" stroke="#1F4E79" stroke-width="28" fill="#FFFFFF"/>
    <polygon points="430,392 470,369 510,392 510,438 470,461 430,438" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>

    <!-- right branch nodes -->
    <polygon points="548,350 588,327 628,350 628,396 588,419 548,396" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>
    <polygon points="548,674 588,651 628,674 628,720 588,743 548,720" stroke="#1F4E79" stroke-width="16" fill="#FFFFFF"/>

    <!-- output hex -->
    <polygon points="700,512 740,489 780,512 780,558 740,581 700,558" stroke="#2EC4B6" stroke-width="22" fill="#FFFFFF"/>
  </g>

  <defs>
    <marker id="arrowNavy" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1F4E79"/>
    </marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2EC4B6"/>
    </marker>
  </defs>
</svg>
