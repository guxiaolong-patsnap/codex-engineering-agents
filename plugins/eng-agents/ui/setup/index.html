<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Agents 设置</title><style>
body{font:14px system-ui;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:white;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{padding:9px;border:1px solid #cbd5e1;border-radius:6px;width:100%}button{cursor:pointer;font-weight:600}button.primary{background:#2563eb;color:white}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}.muted{color:#64748b}.err{color:#dc2626}code{word-break:break-all}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>Engineering Agents 设置</h1><p class="muted">运行项目：<span id="runtime">加载中…</span></p>
<section class="card"><h2>绑定代码仓库</h2><div class="grid"><select id="provider"><option>gitlab</option><option>github</option></select><input id="remote" placeholder="group/project 或 clone URL"><input id="path" placeholder="本机绝对路径"><input id="branch" placeholder="默认分支"></div><button id="addProject">添加仓库</button><table><thead><tr><th>ID</th><th>仓库</th><th>路径</th><th></th></tr></thead><tbody id="projects"></tbody></table></section>
<section class="card"><h2>路由</h2><div class="grid"><input id="labels" placeholder="labels，逗号分隔"><input id="keywords" placeholder="keywords，逗号分隔"><select id="agent"></select><select id="routeEntry"></select></div><button id="addRoute">添加路由</button><table><thead><tr><th>条件</th><th>Agent</th><th>Entrypoint</th><th></th></tr></thead><tbody id="routes"></tbody></table></section>
<section class="card"><h2>定时工作流期望配置</h2><div class="grid"><select id="enabled"><option value="true">启用</option><option value="false">停用</option></select><input id="interval" type="number" min="5" max="1440" value="10"><select id="entrypoint"></select><input id="name" placeholder="任务名称（可选）"></div></section>
<section class="card"><button class="primary" id="save">保存并继续</button><p id="status" class="muted"></p></section></main><script>
const $=id=>document.getElementById(id),projects=[],routing=[];let token='',catalog={};
const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'repo';
function cell(row,value){const td=document.createElement('td');td.textContent=value||'';row.appendChild(td)}
function render(){const pb=$('projects');pb.replaceChildren();projects.forEach((p,i)=>{const tr=document.createElement('tr');cell(tr,p.id);cell(tr,p.remote);cell(tr,p.path);const td=document.createElement('td'),b=document.createElement('button');b.textContent='删除';b.onclick=()=>{projects.splice(i,1);render()};td.appendChild(b);tr.appendChild(td);pb.appendChild(tr)});const rb=$('routes');rb.replaceChildren();routing.forEach((r,i)=>{const tr=document.createElement('tr');cell(tr,[...(r.labels||[]),...(r.keywords||[])].join(', '));cell(tr,(r.agents||[]).join(', '));cell(tr,r.entrypoint);const td=document.createElement('td'),b=document.createElement('button');b.textContent='删除';b.onclick=()=>{routing.splice(i,1);render()};td.appendChild(b);tr.appendChild(td);rb.appendChild(tr)})}
function options(select,items,empty=false){select.replaceChildren();if(empty){const o=document.createElement('option');o.value='';o.textContent='不指定';select.appendChild(o)}items.forEach(item=>{const o=document.createElement('option');o.value=item;o.textContent=item;select.appendChild(o)})}
function payload(){return{apiVersion:'eng-agents.patsnap.com/v1',kind:'Bindings',projects,routing,credentials:{gitlabTokenEnv:'GITLAB_TOKEN',githubTokenEnv:'GITHUB_TOKEN'},automation:{enabled:$('enabled').value==='true',intervalMinutes:Number($('interval').value),entrypoint:$('entrypoint').value,name:$('name').value.trim()||undefined}}}
$('addProject').onclick=()=>{const remote=$('remote').value.trim();if(!remote)return;projects.push({id:slug(remote),provider:$('provider').value,remote,path:$('path').value.trim()||undefined,defaultBranch:$('branch').value.trim()||undefined,enabled:true});$('remote').value='';$('path').value='';render()};
$('addRoute').onclick=()=>{routing.push({labels:split($('labels').value),keywords:split($('keywords').value),agents:[$('agent').value],entrypoint:$('routeEntry').value||undefined});render()};
$('save').onclick=async()=>{try{const r=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload(),csrf_token:token})}),d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');$('status').textContent='已保存。返回 Codex 创建或更新 Scheduled Task。';$('save').disabled=true}catch(e){$('status').className='err';$('status').textContent=e.message}};
Promise.all([fetch('/api/meta').then(r=>r.json()),fetch('/api/catalog').then(r=>r.json()),fetch('/api/config').then(r=>r.json())]).then(([m,cfgCatalog,cfg])=>{token=m.csrf_token;catalog=cfgCatalog;$('runtime').textContent=m.runtime_path;options($('agent'),catalog.agents.map(x=>x.id));options($('entrypoint'),Object.keys(catalog.entrypoints));options($('routeEntry'),Object.keys(catalog.entrypoints),true);projects.push(...(cfg.projects||[]));routing.push(...(cfg.routing||[]));if(cfg.automation){$('enabled').value=String(cfg.automation.enabled!==false);$('interval').value=cfg.automation.intervalMinutes||10;$('entrypoint').value=cfg.automation.entrypoint||Object.keys(catalog.entrypoints)[0];$('name').value=cfg.automation.name||''}render()}).catch(e=>{$('status').className='err';$('status').textContent=e.message});
</script></body></html>
