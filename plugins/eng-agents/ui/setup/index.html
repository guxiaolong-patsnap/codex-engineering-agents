<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engineering Agents — Setup</title>
  <style>
    :root {
      --bg: #f8fafc; --surface: #fff; --border: #e2e8f0; --text: #0f172a;
      --muted: #64748b; --accent: #2563eb; --accent-dk: #1d4ed8; --ok: #059669;
      --font: "Source Sans 3", "Noto Sans SC", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 var(--font); background: var(--bg); color: var(--text); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
      font: 13px var(--mono); margin-bottom: 10px; background: #fff;
    }
    .row { display: grid; grid-template-columns: 100px 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
    @media (max-width: 820px) { .row, .row2 { grid-template-columns: 1fr; } }
    button {
      appearance: none; border: 1px solid var(--border); background: #fff; border-radius: 6px;
      padding: 8px 12px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent-dk); color: #fff; }
    button.success { background: var(--ok); border-color: #047857; color: #fff; }
    button.ghost { background: transparent; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .ok { color: var(--ok); font-weight: 600; }
    .err { color: #dc2626; font-weight: 600; }
    pre {
      background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; overflow: auto; font: 12px var(--mono); max-height: 240px;
    }
    .pill { display: inline-block; background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Engineering Agents 设置</h1>
    <p class="lead">写入当前项目 <code>.git_projects.json</code>、<code>.codex/agents/</code>、<code>.codex/automations/</code>。</p>
    <p class="hint">项目路径：<span id="projectPath" class="pill">加载中…</span></p>

    <div class="card">
      <h2>绑定 Git 仓库</h2>
      <div class="row">
        <div>
          <label>Provider</label>
          <select id="provider">
            <option value="gitlab">gitlab</option>
            <option value="github">github</option>
          </select>
        </div>
        <div>
          <label>Remote</label>
          <input id="remote" placeholder="group/project 或 git@…/repo.git" />
        </div>
        <div>
          <label>Local path（--add-dir）</label>
          <input id="localPath" placeholder="/abs/path/to/checkout" />
        </div>
        <div>
          <label>Branch</label>
          <input id="branch" placeholder="main" />
        </div>
        <div>
          <button type="button" id="addBtn">添加</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Provider</th><th>Remote</th><th>Path</th><th></th></tr>
        </thead>
        <tbody id="projBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Issue 路由规则</h2>
      <div class="row2">
        <div>
          <label>Labels（逗号分隔）</label>
          <input id="ruleLabels" placeholder="bug, security" />
        </div>
        <div>
          <label>Keywords（逗号分隔）</label>
          <input id="ruleKeywords" placeholder="hotfix, CVE" />
        </div>
        <div>
          <label>Agents</label>
          <input id="ruleAgents" placeholder="coding, security" value="coding, security" />
        </div>
        <div>
          <button type="button" id="addRuleBtn">添加规则</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Labels</th><th>Keywords</th><th>Agents</th><th></th></tr>
        </thead>
        <tbody id="ruleBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Automation（Issue 轮询）</h2>
      <div class="row2">
        <div>
          <label>启用</label>
          <select id="autoEnabled">
            <option value="true">是</option>
            <option value="false">否</option>
          </select>
        </div>
        <div>
          <label>间隔（分钟）</label>
          <input id="autoInterval" type="number" min="5" max="1440" value="10" />
        </div>
        <div>
          <label>任务名称</label>
          <input id="autoName" value="Engineering Agents — issue poll" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button type="button" class="primary" id="saveBtn">保存到 .git_projects.json</button>
        <button type="button" class="success" id="applyBtn">保存并应用（物化 agents + automation）</button>
        <button type="button" class="ghost" id="copyBtn">复制 JSON</button>
      </div>
      <p id="status" class="hint"></p>
      <pre id="preview">{}</pre>
    </div>
  </div>
  <script>
    const projects = [];
    const routing = [];
    const $ = (id) => document.getElementById(id);

    function slug(s) {
      return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "repo";
    }

    function splitCsv(s) {
      return s.split(",").map((x) => x.trim()).filter(Boolean);
    }

    function build() {
      return {
        version: 1,
        projects: projects.map((p) => ({ ...p, enabled: true })),
        routing: routing.map((r) => ({
          labels: r.labels?.length ? r.labels : undefined,
          keywords: r.keywords?.length ? r.keywords : undefined,
          agents: r.agents,
          pipeline: r.pipeline || "issue-pipeline",
        })),
        automation: {
          enabled: $("autoEnabled").value === "true",
          interval_minutes: Number($("autoInterval").value) || 10,
          name: $("autoName").value.trim() || undefined,
        },
        credentials: {
          gitlab_token_env: "GITLAB_TOKEN",
          github_token_env: "GITHUB_TOKEN",
        },
      };
    }

    function scrub(obj) {
      const o = structuredClone(obj);
      o.routing = (o.routing || []).map((r) => {
        const x = { ...r };
        if (!x.labels?.length) delete x.labels;
        if (!x.keywords?.length) delete x.keywords;
        return x;
      });
      if (!o.routing.length) delete o.routing;
      return o;
    }

    function renderProjects() {
      $("projBody").innerHTML = projects.map((p, i) => `
        <tr>
          <td>${p.id}</td>
          <td>${p.provider}</td>
          <td><code>${p.remote}</code></td>
          <td><code>${p.path || ""}</code></td>
          <td><button type="button" data-i="${i}" class="rmProj">删除</button></td>
        </tr>`).join("");
      document.querySelectorAll(".rmProj").forEach((btn) => {
        btn.onclick = () => { projects.splice(Number(btn.dataset.i), 1); renderAll(); };
      });
    }

    function renderRules() {
      $("ruleBody").innerHTML = routing.map((r, i) => `
        <tr>
          <td>${(r.labels || []).join(", ")}</td>
          <td>${(r.keywords || []).join(", ")}</td>
          <td>${(r.agents || []).join(", ")}</td>
          <td><button type="button" data-i="${i}" class="rmRule">删除</button></td>
        </tr>`).join("");
      document.querySelectorAll(".rmRule").forEach((btn) => {
        btn.onclick = () => { routing.splice(Number(btn.dataset.i), 1); renderAll(); };
      });
    }

    function renderAll() {
      renderProjects();
      renderRules();
      $("preview").textContent = JSON.stringify(scrub(build()), null, 2);
    }

    async function loadMeta() {
      const meta = await fetch("/api/meta").then((r) => r.json());
      $("projectPath").textContent = meta.project_path;
    }

    async function loadConfig() {
      const cfg = await fetch("/api/config").then((r) => r.json());
      projects.length = 0;
      routing.length = 0;
      (cfg.projects || []).forEach((p) => projects.push({ ...p }));
      (cfg.routing || []).forEach((r) => routing.push({ ...r }));
      if (cfg.automation) {
        $("autoEnabled").value = String(cfg.automation.enabled !== false);
        $("autoInterval").value = cfg.automation.interval_minutes || 10;
        if (cfg.automation.name) $("autoName").value = cfg.automation.name;
      }
      renderAll();
    }

    async function saveConfig() {
      if (!projects.length) {
        $("status").innerHTML = '<span class="err">请至少添加一个 Git 仓库</span>';
        return false;
      }
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(scrub(build())),
      });
      const data = await res.json();
      if (!res.ok) {
        $("status").innerHTML = `<span class="err">${data.error || "保存失败"}</span>`;
        return false;
      }
      $("status").innerHTML = `<span class="ok">已保存</span> → ${data.path}`;
      return true;
    }

    $("addBtn").onclick = () => {
      const remote = $("remote").value.trim();
      if (!remote) return;
      projects.push({
        id: slug(remote),
        provider: $("provider").value,
        remote,
        path: $("localPath").value.trim() || undefined,
        default_branch: $("branch").value.trim() || undefined,
      });
      $("remote").value = "";
      $("localPath").value = "";
      renderAll();
    };

    $("addRuleBtn").onclick = () => {
      const agents = splitCsv($("ruleAgents").value);
      if (!agents.length) return;
      routing.push({
        labels: splitCsv($("ruleLabels").value),
        keywords: splitCsv($("ruleKeywords").value),
        agents,
        pipeline: "issue-pipeline",
      });
      $("ruleLabels").value = "";
      $("ruleKeywords").value = "";
      renderAll();
    };

    $("saveBtn").onclick = () => saveConfig();

    $("applyBtn").onclick = async () => {
      if (!(await saveConfig())) return;
      $("status").textContent = "正在应用 setup…";
      const res = await fetch("/api/apply", { method: "POST" });
      const data = await res.json();
      if (!res.ok) {
        $("status").innerHTML = `<span class="err">应用失败</span> ${data.error || ""}`;
        return;
      }
      $("status").innerHTML = '<span class="ok">Setup 已应用</span> — 请在 Codex App → Automations 确认任务已启用';
      if (data.output) $("preview").textContent = data.output;
    };

    $("copyBtn").onclick = async () => {
      await navigator.clipboard.writeText(JSON.stringify(scrub(build()), null, 2));
      $("status").textContent = "已复制到剪贴板";
    };

    loadMeta().then(loadConfig).catch((e) => {
      $("status").innerHTML = `<span class="err">无法连接 setup server：${e}</span>`;
    });
  </script>
</body>
</html>
